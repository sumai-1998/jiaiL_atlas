name: Pipeline contracts (CPU)
on: [push, pull_request]
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: python -m unittest discover -s scripts -p test_pipelines.py -v
      - run: python scripts/pipelines.py list
