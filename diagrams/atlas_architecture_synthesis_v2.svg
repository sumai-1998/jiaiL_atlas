<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1630" viewBox="0 0 1920 1630" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Atlas 综合架构：统一世界模型与 3DGS 时空闭环</title>
<desc id="desc">综合用户的 GS 闭环假设与 Atlas 官网已知能力绘制。初始化和连续生成是统一多模态自回归扩散 Transformer 的不同使用阶段：多模态输入生成初始视图、深度、点云和 GS；空间上下文保存首帧参考、首帧 GS 渲染、历史 RGB-D、相机与文本。持续循环为世界状态和目标机位渲染粗图，模型结合上下文生成新 RGB-D，几何融合更新世界状态，同时生成历史更新上下文。4D 分别控制相机与场景时间，共享静态背景及动态层；时间重构或预测连接到动态场景更新。持久 GS 回写和具体模块拆分属于综合推演，不是官方公开网络拓扑。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#3469C6"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#087F73"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7855B8"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;} a{cursor:pointer;} a:hover text{text-decoration:underline;}</style>
<rect x="0" y="0" width="1920" height="1630" rx="0" fill="#F5F8FC" stroke="#F5F8FC" stroke-width="1.6"/>
<text x="64" y="91" font-size="42" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="1792">Atlas 综合架构：统一世界模型 + 3DGS 时空闭环</text>
<text x="64" y="137" font-size="24" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="1792">以你的闭环为主线，融合官网的多模态空间上下文、RGB-D 生成与时空能力。</text>
<rect x="64" y="166" width="1792" height="46" rx="10" fill="#EAF8F4" stroke="#EAF8F4" stroke-width="1.6"/>
<text x="84" y="197" font-size="23" font-weight="600" fill="#087F73" text-anchor="start" data-max-width="1740">核心分工：统一模型生成内容与深度；3DGS 保存空间结构；渲染和融合把两者串成闭环。</text>
<text x="64" y="251" font-size="28" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="1792">① 初始化：先建立一个可以继续扩展的局部世界</text>
<rect x="64" y="276" width="330" height="188" rx="18" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="88" y="320" font-size="29" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="282">多模态输入</text>
<text x="88" y="365" font-size="23" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="282">单图 / 多图 / 纯文本</text>
<text x="88" y="404" font-size="23" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="282">视频 / 多视角视频</text>
<text x="88" y="441" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="282">可附加深度与相机条件</text>
<rect x="454" y="276" width="500" height="188" rx="18" fill="#EDF4FF" stroke="#CCDDF3" stroke-width="1.6"/>
<text x="478" y="320" font-size="28" font-weight="700" fill="#3469C6" text-anchor="start" data-max-width="452">世界初始化（Marble 式）</text>
<text x="478" y="365" font-size="23" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="452">统一模型生成参考视图 / 全景与深度</text>
<text x="478" y="404" font-size="23" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="452">深度 + 相机 → 点云 → 初始 3DGS</text>
<text x="478" y="441" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="452">纯文本先生成参考图；图像直接作为锚点</text>
<rect x="1054" y="276" width="802" height="188" rx="18" fill="#EDF4FF" stroke="#CCDDF3" stroke-width="1.6"/>
<text x="1078" y="320" font-size="29" font-weight="700" fill="#3469C6" text-anchor="start" data-max-width="754">空间上下文  Spatial Context</text>
<text x="1078" y="365" font-size="25" font-weight="600" fill="#17324D" text-anchor="start" data-max-width="754">首帧参考 + 首帧 GS 渲染 + 历史 RGB-D</text>
<text x="1078" y="404" font-size="23" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="754">各帧关联相机位置；保留多图与文本条件</text>
<text x="1078" y="441" font-size="22" font-weight="500" fill="#3469C6" text-anchor="start" data-max-width="754">初始化与后续生成共用同一世界模型</text>
<path d="M 394 370 H 454" fill="none" stroke="#3469C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 954 370 H 1054" fill="none" stroke="#3469C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 704 464 V 490 H 229 V 656" fill="none" stroke="#3469C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="80" y="608" font-size="22" font-weight="600" fill="#3469C6" text-anchor="start" data-max-width="140">初始 GS 地图</text>
<text x="454" y="553" font-size="30" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="720">② 持续生成：渲染 → 补全 → 融合</text>
<text x="454" y="597" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="720">三个图像条件保留，再加入相机、深度与时序上下文。</text>
<path d="M 1200 464 V 656" fill="none" stroke="#3469C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1220" y="588" font-size="20" font-weight="500" fill="#3469C6" text-anchor="start" data-max-width="132">读取上下文</text>
<rect x="64" y="656" width="330" height="238" rx="18" fill="#EAF8F4" stroke="#BEE2D8" stroke-width="1.6"/>
<text x="88" y="705" font-size="29" font-weight="700" fill="#087F73" text-anchor="start" data-max-width="282">持久世界状态</text>
<text x="88" y="751" font-size="21" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="282">静态 GS + 动态层 / 4DGS</text>
<text x="88" y="803" font-size="23" font-weight="600" fill="#17324D" text-anchor="start" data-max-width="282">选目标机位 C 与时刻 t</text>
<text x="88" y="858" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="282">读取对应时刻的世界状态</text>
<rect x="454" y="656" width="350" height="238" rx="18" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="478" y="705" font-size="28" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="302">目标视角 GS 渲染</text>
<text x="478" y="751" font-size="22" font-weight="600" fill="#17324D" text-anchor="start" data-max-width="302">粗 RGB + 深度 + 可见性</text>
<text x="478" y="803" font-size="23" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="302">已知区域提供几何引导</text>
<text x="478" y="858" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="302">空洞 / 动态不确定区域待补</text>
<rect x="864" y="656" width="480" height="238" rx="18" fill="#EDF4FF" stroke="#CCDDF3" stroke-width="1.6"/>
<text x="888" y="705" font-size="27" font-weight="700" fill="#3469C6" text-anchor="start" data-max-width="432">统一 AR 扩散 Transformer</text>
<text x="888" y="751" font-size="23" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="432">粗渲染 + 上方空间上下文</text>
<text x="888" y="789" font-size="23" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="432">相机条件 + 时间 / 历史条件</text>
<text x="888" y="828" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="432">Rectified Flow：细化 / 补全</text>
<text x="888" y="868" font-size="26" font-weight="700" fill="#3469C6" text-anchor="start" data-max-width="432">输出新视图 RGB + 深度 D</text>
<rect x="1404" y="656" width="452" height="238" rx="18" fill="#EAF8F4" stroke="#BEE2D8" stroke-width="1.6"/>
<text x="1428" y="705" font-size="28" font-weight="700" fill="#087F73" text-anchor="start" data-max-width="404">三维增量融合（类 SLAM）</text>
<text x="1428" y="751" font-size="22" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="404">RGB-D + 相机 → 新区域点云</text>
<text x="1428" y="790" font-size="22" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="404">与旧地图对齐，融合 / 优化 GS</text>
<text x="1428" y="829" font-size="23" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="404">静态背景写回静态层</text>
<text x="1428" y="868" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="404">动态物体更新对应时刻 / 形变</text>
<path d="M 394 776 H 454" fill="none" stroke="#3469C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 804 776 H 864" fill="none" stroke="#3469C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 1344 776 H 1404" fill="none" stroke="#087F73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 1630 894 V 971 H 229 V 894" fill="none" stroke="#087F73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="930" y="955" font-size="25" font-weight="600" fill="#087F73" text-anchor="middle" data-max-width="1400">新区域并入世界状态，再用更新后的 GS 渲染下一视角</text>
<path d="M 1300 656 V 624 H 1374 V 464" fill="none" stroke="#3469C6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
<text x="1396" y="584" font-size="21" font-weight="500" fill="#3469C6" text-anchor="start" data-max-width="430">新 RGB-D 与相机追加到历史</text>
<text x="64" y="1020" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="1792">世界地图记住“空间在哪里”，上下文记住“看过什么”；两者在每轮生成后同步更新。</text>
<text x="64" y="1080" font-size="30" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="1792">③ 4D：空间与时间分开控制，复用同一套生成—融合闭环</text>
<text x="64" y="1125" font-size="23" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="1792">共享动态场景：静态 GS 背景 + 动态 4DGS / 形变场；换视角与推进时间可以组合。</text>
<rect x="64" y="1158" width="864" height="172" rx="18" fill="#F4EFFC" stroke="#DDD0F1" stroke-width="1.6"/>
<text x="88" y="1203" font-size="28" font-weight="700" fill="#7855B8" text-anchor="start" data-max-width="816">空间路径：固定 t，改变 C</text>
<text x="88" y="1249" font-size="24" font-weight="600" fill="#17324D" text-anchor="start" data-max-width="816">取同一时刻场景 → 渲染 → RGB-D 生成 → 融合</text>
<text x="88" y="1296" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="816">冻结动作换机位；需要扩展新区域时进入上方闭环</text>
<rect x="992" y="1158" width="864" height="172" rx="18" fill="#F4EFFC" stroke="#DDD0F1" stroke-width="1.6"/>
<text x="1016" y="1203" font-size="28" font-weight="700" fill="#7855B8" text-anchor="start" data-max-width="816">时间路径：固定 C，推进 t</text>
<text x="1016" y="1249" font-size="24" font-weight="600" fill="#17324D" text-anchor="start" data-max-width="816">历史视频 / 状态 → 时序重构或预测 → RGB-D</text>
<text x="1016" y="1296" font-size="22" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="816">更新 4DGS / 形变 → 新时刻渲染；空间闭环继续复用</text>
<rect x="64" y="1352" width="1792" height="50" rx="12" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="88" y="1385" font-size="23" font-weight="500" fill="#17324D" text-anchor="start" data-max-width="1744">联合模式：C 与 t 同时变化；同一模型负责视觉 / 时序生成，动态层保存物体随时间的变化。</text>
<text x="64" y="1436" font-size="25" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="1792">统一对外输出</text>
<rect x="64" y="1460" width="410" height="90" rx="18" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="86" y="1498" font-size="25" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="366">图像 / 360 全景</text>
<text x="86" y="1532" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="366">文本 / 图像条件生成</text>
<rect x="524" y="1460" width="410" height="90" rx="18" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="546" y="1498" font-size="25" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="366">相机可控长视频</text>
<text x="546" y="1532" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="366">场景漫游 / 新视角</text>
<rect x="984" y="1460" width="410" height="90" rx="18" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="1006" y="1498" font-size="25" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="366">点云 / 3DGS 资产</text>
<text x="1006" y="1532" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="366">可浏览、可导出的世界</text>
<rect x="1444" y="1460" width="412" height="90" rx="18" fill="#fff" stroke="#D7E2EE" stroke-width="1.6"/>
<text x="1466" y="1498" font-size="25" font-weight="700" fill="#17324D" text-anchor="start" data-max-width="368">动态重构 / 仿真观测</text>
<text x="1466" y="1532" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="368">视频换机位 / 机器人 RGB-D</text>
<text x="64" y="1590" font-size="21" font-weight="400" fill="#5E738A" text-anchor="start" data-max-width="940">综合推演：你的 GS 闭环 + 官网已知模型能力。</text>
