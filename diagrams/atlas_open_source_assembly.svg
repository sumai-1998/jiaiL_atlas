<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1890" viewBox="0 0 1920 1890" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Atlas 综合版的开源组装架构图</title>
<desc id="desc">对应 atlas_architecture_synthesis_v2.svg 的功能组装方案，优先选择 2025 年 9 月 6 日至 2026 年 9 月 6 日公开的方法、版本或代码。HY-World 2.0 初始化世界；Spatia 负责空间参考检索、历史与 RGB 生成；MapAnything 补充深度及相机；GaME 维护并增量更新三维高斯地图，SAM 3.1 提供实例分割，gsplat 渲染目标视角。自写组件包括会话状态、初始 GS 导入、GS 条件适配和动态同步。动态重构用 NoPo4D 或 ClipGStream，时间生成可另选 LongLive 2.0。WorldWarp 与 AlayaWorld 是替换生成主干的候选，不彼此串联。Spark 展示资产，MuJoCo 为可选物理外围，F4Splat 为初始化备选。项目链接可点击；具体许可证和接口见配套清单。未声称这些仓库已经完成跨项目集成。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#3469C6"/></marker>
