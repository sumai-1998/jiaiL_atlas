</a>
<a href="https://guanjunwu.github.io/4dgs/" xlink:href="https://guanjunwu.github.io/4dgs/" target="_blank" rel="noopener noreferrer"><text x="814" y="1541" font-size="20" font-weight="600" fill="#3469C6" text-anchor="start" data-max-width="330">4D-GS 项目 ↗</text>
</a>
<text x="1856" y="1541" font-size="20" font-weight="400" fill="#5E738A" text-anchor="end" data-max-width="560">原生 SVG · 保留所有旧图</text>
</svg>
